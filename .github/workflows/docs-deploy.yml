name: deploy docs

# main deploys production; pull requests (and manual runs on other branches) only build
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'resources/design.html'
      - 'resources/inspirations/selected/**'
      - '.github/workflows/docs-deploy.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'resources/design.html'
      - 'resources/inspirations/selected/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROD: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: build
        if: env.PROD != 'true'
        working-directory: docs
        run: pnpm install --frozen-lockfile && pnpm build
      - name: deploy production to vercel
        if: env.PROD == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"
