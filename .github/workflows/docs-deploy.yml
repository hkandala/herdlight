name: deploy docs

on:
  push:
    paths:
      - 'docs/**'
      - 'resources/design.html'
      - 'resources/inspirations/selected/**'
      - '.github/workflows/docs-deploy.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'resources/design.html'
      - 'resources/inspirations/selected/**'
  workflow_dispatch:

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  # production only for pushes (or manual runs) on main; everything else is a preview
  PROD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: install vercel cli
        run: npm install -g vercel@latest
      - name: pull vercel project settings
        run: vercel pull --yes --environment=${{ env.PROD == 'true' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: build with vercel
        run: vercel build ${{ env.PROD == 'true' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: deploy to vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ env.PROD == 'true' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "${{ env.PROD == 'true' && 'Production' || 'Preview' }}: $url" >> "$GITHUB_STEP_SUMMARY"
